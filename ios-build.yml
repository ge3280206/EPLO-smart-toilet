name: Build iOS IPA

# 用法：仓库页面 → Actions → Build iOS IPA → Run workflow
# 产物：EPLOSmart-unsigned.ipa（未签名，用 Sideloadly / AltStore 自签安装）
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'EPLOiOS/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (code signing disabled)
        run: |
          xcodebuild \
            -project EPLOiOS/EPLOiOS.xcodeproj \
            -scheme EPLOiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r EPLOSmart-unsigned.ipa Payload
          ls -lh EPLOSmart-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EPLOSmart-unsigned-ipa
          path: EPLOSmart-unsigned.ipa
          retention-days: 30
